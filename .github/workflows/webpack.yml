name: Deploy application
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Test and build
      run: |
        npm ci
        npm test
        npm run build
    - name: Copy file
      if: github.event_name == 'push'
      run: |
       rm -f /data/www/woordklok/assets/*
       cp -r ${{ github.workspace }}/dist/* /data/www/woordklok/
